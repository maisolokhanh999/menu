<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Events</title>
    <link rel="stylesheet" href="./event.css">
</head>

<body>
    <section class="main-container">

        <div class="header-section">
            <div class="box1">
                <p class="p1">Events</p>
                <div class="box2">
                    <img src="./img/Vector (2).png" alt="search icon">
                    <input type="text" placeholder="Search here..." required>
                </div>
            </div>
        </div>
        <div class="controls-section">
            <div class="box3">
                <p class="p2">Calendar</p>
                <div class="box6">
                    <select id="monthSelect" class="box4"></select>
                    <select id="yearSelect" class="box4"></select>
                    <button class="box5">
                        <img src="./img/+.png" alt="add icon">
                        <p>New Student</p>
                    </button>
                </div>
            </div>
        </div>

        <div class="calendar-section">
            <div id="calendar" class="parent"></div>
        </div>
    </section>


    <div id="modalOverlay" class="modal-overlay">
        <div id="noteModal" class="modal-content">
            <div class="modal-header">
                <h3 id="selectedDate">Chọn ngày</h3>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <label for="noteInput">Ghi chú:</label>
                <textarea id="noteInput" placeholder="Nhập ghi chú của bạn..." rows="5"></textarea>


                <div id="savedNoteDisplay" class="saved-note"></div>
            </div>
            <div class="modal-footer">
                <button id="saveBtn" class="btn-save">Lưu</button>
                <button id="cancelBtn" class="btn-cancel">Hủy</button>
            </div>
        </div>
    </div>

    <script src="./event.js"></script>
    </section>
</body>

</html>
