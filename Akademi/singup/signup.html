<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Akademic</title>
    <link rel="stylesheet" href="./signup.css">
    
</head>
<body>
    <section>
        <div class="login-box">
        <h2>Akademic Sign Up</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="text" id="fullName" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <button type="submit" id="submitBtn">Sign Up</button>
            <p class="error-message" id="errorMessage" style="display: none; color: red; margin-top: 10px;"></p>
            <p class="success-message" id="successMessage" style="display: none; color: green; margin-top: 10px;"></p>
        </form>
        <p><a href="../login/index.html">Already have an account? Login</a></p>
    </div>

    </section>
    <script src="./signup.js"></script>
</body>
</html>
