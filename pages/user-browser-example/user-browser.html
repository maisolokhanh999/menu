<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý User - Ví Dụ Duyệt User</title>
    <link rel="stylesheet" href="user-browser.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="page-header">
            <div class="header-left">
                <h1>Quản Lý Users</h1>
                <p class="subtitle">Danh sách tất cả người dùng trong hệ thống</p>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="addUserBtn">
                    <span class="icon">+</span>
                    Thêm User Mới
                </button>
            </div>
        </header>

        <!-- Search and Filter Section -->
        <div class="controls-section">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Tìm kiếm theo tên hoặc email..."
                >
                <span class="search-icon">🔍</span>
            </div>
            
            <div class="filter-group">
                <select id="roleFilter" class="filter-select">
                    <option value="">Tất cả vai trò</option>
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                    <option value="Manager">Manager</option>
                    <option value="Guest">Guest</option>
                </select>
                
                <select id="statusFilter" class="filter-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="Active">Hoạt động</option>
                    <option value="Inactive">Không hoạt động</option>
                </select>
            </div>
        </div>
        <!-- Users Table -->
        <div class="table-container">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Avatar</th>
                        <th>Tên</th>
                        <th>Email</th>
                        <th>Vai Trò</th>
                        <th>Trạng Thái</th>
                        <th>Ngày Tạo</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Users will be rendered here by JavaScript -->
                </tbody>
            </table>
            
            <div id="noResults" class="no-results" style="display: none;">
                <div class="no-results-icon">🔍</div>
                <h3>Không tìm thấy kết quả</h3>
                <p>Không có user nào phù hợp với tìm kiếm của bạn</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrapper">
            <div class="pagination-info">
            </div>
            <div class="pagination-controls" id="paginationControls">
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit User -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm User Mới</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            
            <form id="userForm" class="user-form">
                <input type="hidden" id="userId">
                
                <div class="form-group">
                    <label for="userName">Tên đầy đủ *</label>
                    <input 
                        type="text" 
                        id="userName" 
                        class="form-input" 
                        placeholder="Nhập tên đầy đủ"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="userEmail">Email *</label>
                    <input 
                        type="email" 
                        id="userEmail" 
                        class="form-input" 
                        placeholder="example@email.com"
                        required
                    >
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="userRole">Vai trò *</label>
                        <select id="userRole" class="form-input" required>
                            <option value="">Chọn vai trò</option>
                            <option value="Admin">Admin</option>
                            <option value="Manager">Manager</option>
                            <option value="User">User</option>
                            <option value="Guest">Guest</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="userStatus">Trạng thái *</label>
                        <select id="userStatus" class="form-input" required>
                            <option value="Active">Hoạt động</option>
                            <option value="Inactive">Không hoạt động</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="userAvatar">Avatar URL (tùy chọn)</label>
                    <input 
                        type="text" 
                        id="userAvatar" 
                        class="form-input" 
                        placeholder="https://example.com/avatar.jpg"
                    >
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Hủy</button>
                    <button type="submit" class="btn btn-primary">
                        <span id="submitBtnText">Thêm User</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Xác Nhận Xóa</h2>
                <button class="close-btn" id="closeDeleteModal">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="delete-icon">🗑️</div>
                <p>Bạn có chắc chắn muốn xóa user <strong id="deleteUserName"></strong>?</p>
                <p class="warning-text">Hành động này không thể hoàn tác!</p>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelDeleteBtn">Hủy</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
            </div>
        </div>
    </div>

    <script src="user-browser.js"></script>
</body>
</html>
